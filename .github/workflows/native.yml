name: native packages
on:
  workflow_dispatch:
    inputs:
      target:
        description: Package job
        type: choice
        default: all
        options: [all, niri, waybar, owenctl, desktop-tools, telegramtui, runtimes, packages]
permissions:
  contents: read
jobs:
  niri:
    if: inputs.target == 'all' || inputs.target == 'niri'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y podman gnupg curl
      - run: python3 tests/slackware.py --build-tools --profile recipes/niri.packages --prepare-only --work "$RUNNER_TEMP/slackware-niri"
      - name: Fetch compositor sources
        run: |
          mkdir -p "$RUNNER_TEMP/sources" "$RUNNER_TEMP/packages"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/niri-wm/niri/archive/refs/tags/v26.04.tar.gz -o "$RUNNER_TEMP/sources/niri-26.04.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.3.0/libdisplay-info-0.3.0.tar.gz -o "$RUNNER_TEMP/sources/libdisplay-info-0.3.0.tar.gz"
      - name: Build Niri without systemd integration
        run: |
          podman run --rm --env CARGO_HTTP_CAINFO=/host-ca.pem --env CURL_CA_BUNDLE=/host-ca.pem -v /etc/ssl/certs/ca-certificates.crt:/host-ca.pem:ro --env SOURCES=/sources --env OUTPUT=/output --env WORK=/tmp/niri-build --env JOBS=2 -v "$PWD:/src:ro" -v "$RUNNER_TEMP/sources:/sources:ro" -v "$RUNNER_TEMP/packages:/output" localhost/holypkg-current-tests sh /src/recipes/niri.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: niri-development
          path: |
            ${{ runner.temp }}/packages/*
            ${{ runner.temp }}/sources/*
            ${{ runner.temp }}/slackware-niri/snapshot.sha256
  waybar:
    if: inputs.target == 'all' || inputs.target == 'waybar'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y podman gnupg curl
      - run: python3 tests/slackware.py --build-tools --profile recipes/waybar.packages --prepare-only --work "$RUNNER_TEMP/slackware-waybar"
      - name: Fetch bar sources
        run: |
          mkdir -p "$RUNNER_TEMP/sources" "$RUNNER_TEMP/packages"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/Alexays/Waybar/archive/refs/tags/0.15.0.tar.gz -o "$RUNNER_TEMP/sources/waybar-0.15.0.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/1.9.5.tar.gz -o "$RUNNER_TEMP/sources/jsoncpp-1.9.5.tar.gz"
      - name: Build Waybar
        run: |
          podman run --rm --env SOURCES=/sources --env OUTPUT=/output --env WORK=/tmp/waybar-build --env JOBS=2 -v "$PWD:/src:ro" -v "$RUNNER_TEMP/sources:/sources:ro" -v "$RUNNER_TEMP/packages:/output" localhost/holypkg-current-tests sh /src/recipes/waybar.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waybar-development
          path: |
            ${{ runner.temp }}/packages/*
            ${{ runner.temp }}/sources/*
            ${{ runner.temp }}/slackware-waybar/snapshot.sha256
  owenctl:
    if: inputs.target == 'all' || inputs.target == 'owenctl'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: owenewans/owendots
          ref: 96c02caaf535a7641cbecd305da40f8feec0685a
          path: owendots-source
      - run: sudo apt-get update && sudo apt-get install -y podman gnupg curl
      - run: |
          printf 'gcc-g++\ncmake\nlibuv\nSDL3\nflex\n' > "$RUNNER_TEMP/gui.packages"
          python3 tests/slackware.py --profile "$RUNNER_TEMP/gui.packages" --prepare-only --work "$RUNNER_TEMP/slackware-gui"
      - name: Fetch GUI build sources
        run: |
          mkdir -p "$RUNNER_TEMP/sources" "$RUNNER_TEMP/packages"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/raysan5/raylib/archive/refs/tags/6.0.tar.gz -o "$RUNNER_TEMP/sources/raylib-6.0.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/raysan5/raygui/archive/refs/tags/5.0.tar.gz -o "$RUNNER_TEMP/sources/raygui-5.0.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/sources/zig-x86_64-linux-0.16.0.tar.xz"
          tar --exclude=.git -cJf "$RUNNER_TEMP/sources/owendots-96c02ca.tar.xz" owendots-source
      - name: Build desktop controls
        run: |
          podman run --rm --env SOURCES=/sources --env OWENDOTS=/src/owendots-source --env OUTPUT=/output --env WORK=/tmp/owenctl-build --env JOBS=2 -v "$PWD:/src:ro" -v "$RUNNER_TEMP/sources:/sources:ro" -v "$RUNNER_TEMP/packages:/output" localhost/holypkg-current-tests sh /src/recipes/owenctl.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owenctl-development
          path: |
            ${{ runner.temp }}/packages/*
            ${{ runner.temp }}/sources/*
            ${{ runner.temp }}/slackware-gui/snapshot.sha256
  runtimes:
    if: inputs.target == 'all' || inputs.target == 'runtimes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y podman gnupg curl
      - run: |
          printf 'llvm\nvulkan-sdk\n' > "$RUNNER_TEMP/runtime.packages"
          python3 tests/slackware.py --profile "$RUNNER_TEMP/runtime.packages" --prepare-only --work "$RUNNER_TEMP/slackware-runtime"
      - name: Extract native runtime packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          podman run --rm --env SOURCES=/sources --env OUTPUT=/output --env WORK=/tmp/llvm-runtime -v "$PWD:/src:ro" -v "$RUNNER_TEMP/slackware-runtime/current-packages:/sources:ro" -v "$RUNNER_TEMP/packages:/output" localhost/holypkg-current-tests sh -c 'sh /src/recipes/llvm-runtime.sh && WORK=/tmp/vulkan-runtime sh /src/recipes/vulkan-runtime.sh'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphics-runtime-development
          path: |
            ${{ runner.temp }}/packages/*
            ${{ runner.temp }}/slackware-runtime/snapshot.sha256
  packages:
    if: inputs.target == 'all' || inputs.target == 'packages'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y podman gnupg curl
      - run: python3 tests/slackware.py --build-tools --prepare-only --work "$RUNNER_TEMP/slackware-native"
      - name: Fetch pinned upstream sources
        run: |
          mkdir -p "$RUNNER_TEMP/sources" "$RUNNER_TEMP/packages"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/rpm-software-management/rpm/releases/download/rpm-6.1.0-release/rpm-6.1.0.tar.bz2 -o "$RUNNER_TEMP/sources/rpm-6.1.0.tar.bz2"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/rpm-software-management/rpm-sequoia/archive/8e0b76e1e75c83d7d8e6f38976b0c83b52ebe7ee.tar.gz -o "$RUNNER_TEMP/sources/rpm-sequoia-1.10.3.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/Duncaen/OpenDoas/archive/b96106b7e34ac591ae78b1684e9be3a265122463.tar.gz -o "$RUNNER_TEMP/sources/opendoas-b96106b.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/Limine-Bootloader/Limine/releases/download/v12.9.0/limine-binary.tar.xz -o "$RUNNER_TEMP/sources/limine-binary-12.9.0.tar.xz"
      - name: Build native Slackware package
        run: |
          podman run --rm --env CARGO_HTTP_CAINFO=/host-ca.pem --env CURL_CA_BUNDLE=/host-ca.pem -v /etc/ssl/certs/ca-certificates.crt:/host-ca.pem:ro --env SOURCES=/sources --env OUTPUT=/output --env WORK=/tmp/build --env JOBS=2 --env CARGO_BUILD_JOBS=2 -v "$PWD:/src:ro" -v "$RUNNER_TEMP/sources:/sources:ro" -v "$RUNNER_TEMP/packages:/output" localhost/holypkg-current-tests sh -c 'sh /src/recipes/rpm-tools.sh && installpkg /output/holypkg-rpm-tools-6.1.0-x86_64-1_owen.txz && python3 /src/tests/rpm-verifier.py /tmp/build/rpm-build/tools/rpmsign && WORK=/tmp/doas-build sh /src/recipes/doas.sh && installpkg /output/owendoas-6.8.2_b96106b-x86_64-1_owen.txz && python3 /src/tests/doas.py && WORK=/tmp/limine-build sh /src/recipes/limine.sh'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-packages-development
          path: |
            ${{ runner.temp }}/packages/*.txz
            ${{ runner.temp }}/sources/*
            ${{ runner.temp }}/slackware-native/snapshot.sha256
  desktop-tools:
    if: inputs.target == 'all' || inputs.target == 'desktop-tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y podman gnupg curl
      - run: python3 tests/slackware.py --build-tools --profile recipes/desktop-tools.packages --prepare-only --work "$RUNNER_TEMP/slackware-tools"
      - name: Fetch desktop sources
        run: |
          mkdir -p "$RUNNER_TEMP/sources" "$RUNNER_TEMP/packages"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz -o "$RUNNER_TEMP/sources/aria2-1.37.0.tar.xz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://gitlab.freedesktop.org/emersion/grim/-/archive/v1.5.0/grim-v1.5.0.tar.gz -o "$RUNNER_TEMP/sources/grim-1.5.0.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/artemsen/swayimg/archive/refs/tags/v5.6.tar.gz -o "$RUNNER_TEMP/sources/swayimg-5.6.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/dawsers/scroll/archive/refs/tags/1.12.21.tar.gz -o "$RUNNER_TEMP/sources/scroll-1.12.21.tar.gz"
      - name: Build native desktop utilities and scroll
        run: |
          podman run --rm --env SOURCES=/sources --env OUTPUT=/output --env WORK=/tmp/tools-build --env JOBS=2 -v "$PWD:/src:ro" -v "$RUNNER_TEMP/sources:/sources:ro" -v "$RUNNER_TEMP/packages:/output" localhost/holypkg-current-tests sh -c 'sh /src/recipes/desktop-tools.sh && WORK=/tmp/scroll-build sh /src/recipes/scroll.sh'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-tools-development
          path: |
            ${{ runner.temp }}/packages/*
            ${{ runner.temp }}/sources/*
            ${{ runner.temp }}/slackware-tools/snapshot.sha256
  telegramtui:
    if: inputs.target == 'all' || inputs.target == 'telegramtui'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y podman gnupg curl
      - run: |
          printf 'gcc-g++\ncmake\nlibuv\ngperf\n' > "$RUNNER_TEMP/telegram.packages"
          python3 tests/slackware.py --profile "$RUNNER_TEMP/telegram.packages" --prepare-only --work "$RUNNER_TEMP/slackware-telegram"
      - name: Fetch pinned Telegram sources and binary
        run: |
          mkdir -p "$RUNNER_TEMP/sources" "$RUNNER_TEMP/packages"
          curl -fsSL --proto '=https' --proto-redir '=https' https://codeload.github.com/tdlib/td/tar.gz/ea97bcdd3a15523c58ddfe772b4547187cf5bbeb -o "$RUNNER_TEMP/sources/tdlib-ea97bcdd.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://codeload.github.com/k4dy/telegramtui/tar.gz/refs/tags/v1.0.0 -o "$RUNNER_TEMP/sources/telegramtui-1.0.0.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/k4dy/telegramtui/releases/download/v1.0.0/telegramtui-1.0.0.jar -o "$RUNNER_TEMP/sources/telegramtui-1.0.0.jar"
      - name: Build native TDLib and package TelegramTUI
        run: |
          podman run --rm --env SOURCES=/sources --env OUTPUT=/output --env WORK=/tmp/tdlib-build --env JOBS=2 -v "$PWD:/src:ro" -v "$RUNNER_TEMP/sources:/sources:ro" -v "$RUNNER_TEMP/packages:/output" localhost/holypkg-current-tests sh -c 'sh /src/recipes/tdlib.sh && WORK=/tmp/telegramtui-package sh /src/recipes/telegramtui.sh'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telegramtui-development
          path: |
            ${{ runner.temp }}/packages/*
            ${{ runner.temp }}/sources/*
            ${{ runner.temp }}/slackware-telegram/snapshot.sha256
