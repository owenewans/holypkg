name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools gnupg
      - run: zig build test
      - run: zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe
      - run: python3 tests/archive.py zig-out/bin/holypkg
      - run: python3 tests/providers.py zig-out/bin/holypkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: holypkg-x86_64-linux-development
          path: zig-out/bin/holypkg
  slackware:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: holypkg-x86_64-linux-development
          path: zig-out/bin
      - run: chmod +x zig-out/bin/holypkg
      - run: sudo apt-get update && sudo apt-get install -y podman gnupg curl
      - run: python3 tests/slackware.py --work "$RUNNER_TEMP/slackware-tests"
      - name: Package and install the static CLI
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          podman run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/packages:/output" -e OUTPUT=/output -e WORK=/tmp/package localhost/holypkg-current-tests sh /src/recipes/holypkg.sh
          podman run --rm -v "$RUNNER_TEMP/packages:/packages:ro" localhost/holypkg-current-tests sh -c 'installpkg /packages/holypkg-0.1.0-x86_64-1_owen.txz && holypkg --help && removepkg holypkg'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: holypkg-slackware-development
          path: ${{ runner.temp }}/packages/*.txz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: slackware-test-evidence
          path: |
            ${{ runner.temp }}/slackware-tests/*.log
            ${{ runner.temp }}/slackware-tests/snapshot.sha256
